<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MindFlow — Cartes mentales</title>
  <meta name="description" content="Cartes mentales interactives, multi-projets, propulsées par Supabase." />
  <meta name="theme-color" content="#6d28d9" />

  <!-- Police Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind (Play CDN) — aucune étape de build requise pour GitHub Pages -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          fontFamily: {
            sans: ["Inter", "ui-sans-serif", "system-ui", "-apple-system", "Segoe UI", "Roboto", "sans-serif"],
          },
          colors: {
            brand: {
              50: "#f5f3ff", 100: "#ede9fe", 200: "#ddd6fe", 300: "#c4b5fd",
              400: "#a78bfa", 500: "#8b5cf6", 600: "#7c3aed", 700: "#6d28d9",
              800: "#5b21b6", 900: "#4c1d95", 950: "#2e1065",
            },
          },
          boxShadow: {
            soft: "0 1px 2px rgba(15,23,42,.04), 0 4px 16px rgba(15,23,42,.06)",
            lift: "0 8px 30px rgba(15,23,42,.12)",
            glow: "0 0 0 1px rgba(124,58,237,.25), 0 8px 30px rgba(124,58,237,.25)",
          },
          keyframes: {
            "fade-in": { "0%": { opacity: 0 }, "100%": { opacity: 1 } },
            "pop-in": { "0%": { opacity: 0, transform: "translateY(8px) scale(.98)" }, "100%": { opacity: 1, transform: "translateY(0) scale(1)" } },
            "slide-up": { "0%": { opacity: 0, transform: "translateY(16px)" }, "100%": { opacity: 1, transform: "translateY(0)" } },
            shimmer: { "100%": { transform: "translateX(100%)" } },
          },
          animation: {
            "fade-in": "fade-in .2s ease-out",
            "pop-in": "pop-in .22s cubic-bezier(.16,1,.3,1)",
            "slide-up": "slide-up .35s cubic-bezier(.16,1,.3,1) both",
          },
        },
      },
    };
  </script>

  <!-- Configuration Supabase (à éditer) — chargée AVANT les modules -->
  <script src="./config.js"></script>

  <!-- Applique le thème le plus tôt possible pour éviter le flash -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("mf-theme");
        var dark = t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    })();
  </script>

  <style>
    :root { color-scheme: light dark; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      background: #f6f7fb;
      color: #0f172a;
    }
    .dark body { background: #0b1020; color: #e2e8f0; }

    /* Fond décoratif animé (aurora) */
    .mf-aurora::before {
      content: ""; position: fixed; inset: -20%; z-index: -1; pointer-events: none;
      background:
        radial-gradient(40% 40% at 15% 20%, rgba(124,58,237,.18), transparent 60%),
        radial-gradient(45% 45% at 85% 15%, rgba(14,165,233,.16), transparent 60%),
        radial-gradient(50% 50% at 80% 85%, rgba(236,72,153,.14), transparent 60%);
      filter: blur(10px);
    }

    .mf-node .mf-text:empty::before { content: "…"; color: #cbd5e1; }
    .dark .mf-node .mf-text:empty::before { color: #475569; }

    /* Barre de défilement discrète */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; border: 2px solid transparent; background-clip: padding-box; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; background-clip: padding-box; }
    .dark ::-webkit-scrollbar-thumb { background: #334155; background-clip: padding-box; }

    /* Squelette de chargement */
    .mf-skeleton { position: relative; overflow: hidden; background: rgba(148,163,184,.15); }
    .mf-skeleton::after {
      content: ""; position: absolute; inset: 0; transform: translateX(-100%);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent);
      animation: shimmer 1.4s infinite;
    }
    .dark .mf-skeleton::after { background: linear-gradient(90deg, transparent, rgba(255,255,255,.06), transparent); }

    [contenteditable]:focus { outline: none; }
  </style>
</head>
<body class="h-full">
  <div id="app" class="h-full"></div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
